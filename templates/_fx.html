{# 慶祝特效（canvas）：window.fx.celebrate('small' | 'big' | 'jackpot')
   small   = 中央噴一把彩帶
   big     = 左右兩門彩帶砲 + 從天而降的彩帶雨 + 星星閃光
   jackpot = big 再加上金幣雨、連發三波煙火 #}
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS = ['#f7c948', '#ffe58a', '#e63946', '#ff8c42', '#2ec4b6', '#5dfc8d', '#ffffff', '#4d7cff', '#ff5fa2'];
  let cv = null, cx = null, parts = [], running = false, W = 0, H = 0, dpr = 1;

  const ensure = () => {
    if (cv) return;
    cv = document.createElement('canvas');
    cv.className = 'fx-canvas';
    document.body.appendChild(cv);
    cx = cv.getContext('2d');
    const size = () => {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    size();
    addEventListener('resize', size);
  };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // kind: rect 彩帶片 / circle 圓點 / ribbon 長條捲帶 / star 星星閃光 / coin 金幣
  const add = (x, y, vx, vy, kind, opt = {}) => parts.push({
    x, y, vx, vy, kind,
    c: opt.c || pick(COLORS),
    s: opt.s || rnd(6, 11),
    r: rnd(0, Math.PI * 2), vr: rnd(-0.25, 0.25),
    flip: rnd(0, Math.PI * 2), vf: rnd(0.08, 0.2),
    g: opt.g ?? 0.18, drag: opt.drag ?? 0.985,
    life: opt.life || rnd(160, 240), age: 0, delay: opt.delay || 0,
  });

  const burst = (x, y, n, angle, spread, speed, delay = 0) => {
    for (let i = 0; i < n; i++) {
      const a = angle + rnd(-spread, spread), v = rnd(speed * 0.55, speed);
      add(x, y, Math.cos(a) * v, Math.sin(a) * v, pick(['rect', 'rect', 'circle', 'ribbon']), {delay: delay + rnd(0, 6)});
    }
  };
  const rain = (n, frames, kind = null) => {
    for (let i = 0; i < n; i++) {
      add(rnd(0, W), rnd(-80, -10), rnd(-1, 1), rnd(1, 3), kind || pick(['rect', 'circle', 'ribbon']),
          {delay: rnd(0, frames), g: kind === 'coin' ? 0.12 : 0.05, drag: 0.995, life: 400,
           c: kind === 'coin' ? '#f7c948' : null, s: kind === 'coin' ? rnd(12, 18) : null});
    }
  };
  const sparkles = (n, frames) => {
    for (let i = 0; i < n; i++) add(rnd(W * 0.1, W * 0.9), rnd(H * 0.1, H * 0.55), 0, 0, 'star',
      {g: 0, drag: 1, life: rnd(30, 55), delay: rnd(0, frames), c: pick(['#fff', '#ffe58a', '#f7c948']), s: rnd(8, 16)});
  };
  const firework = (x, y, delay) => {
    const c = pick(COLORS);
    for (let i = 0; i < 46; i++) {
      const a = (i / 46) * Math.PI * 2, v = rnd(4, 7);
      add(x, y, Math.cos(a) * v, Math.sin(a) * v, 'circle', {c, s: rnd(3, 5), g: 0.06, drag: 0.96, life: rnd(55, 80), delay});
    }
  };

  const draw = p => {
    const k = Math.max(0, 1 - Math.max(0, p.age - p.life + 40) / 40);   // 最後 40 格淡出
    cx.globalAlpha = k;
    cx.save();
    cx.translate(p.x, p.y);
    cx.rotate(p.r);
    cx.fillStyle = p.c;
    if (p.kind === 'rect') {
      cx.scale(1, Math.cos(p.flip));
      cx.fillRect(-p.s / 2, -p.s * 0.3, p.s, p.s * 0.6);
    } else if (p.kind === 'ribbon') {
      cx.scale(Math.cos(p.flip), 1);
      cx.fillRect(-p.s * 0.18, -p.s, p.s * 0.36, p.s * 2);
    } else if (p.kind === 'circle') {
      cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, Math.PI * 2); cx.fill();
    } else if (p.kind === 'coin') {
      cx.scale(Math.cos(p.flip), 1);
      cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, Math.PI * 2); cx.fill();
      cx.strokeStyle = '#b8860b'; cx.lineWidth = 2; cx.stroke();
      cx.fillStyle = '#7a5200'; cx.font = `900 ${p.s * 0.7}px sans-serif`;
      cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('$', 0, 1);
    } else if (p.kind === 'star') {
      const t = Math.sin((p.age / p.life) * Math.PI), s = p.s * t;
      cx.globalAlpha = t;
      cx.beginPath();
      for (let i = 0; i < 8; i++) {
        const rr = i % 2 ? s * 0.18 : s, a = i * Math.PI / 4;
        cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      cx.closePath(); cx.fill();
    }
    cx.restore();
  };

  const loop = () => {
    cx.clearRect(0, 0, W, H);
    parts = parts.filter(p => {
      if (p.delay > 0) { p.delay--; return true; }
      p.age++;
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
      if (p.kind === 'rect' || p.kind === 'ribbon') p.vx += Math.sin(p.age / 12 + p.flip) * 0.05;   // 飄
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.flip += p.vf;
      draw(p);
      return p.age < p.life && p.y < H + 60;
    });
    cx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(loop);
    else { running = false; cv.style.display = 'none'; }
  };

  function celebrate(level = 'big') {
    if (reduce) return;
    ensure();
    cv.style.display = 'block';
    if (level === 'small') {
      burst(W / 2, H * 0.62, 70, -Math.PI / 2, 0.7, 13);
      sparkles(8, 30);
    } else {
      // 左右兩門彩帶砲
      burst(-10, H * 0.85, 90, -Math.PI / 3, 0.35, 21);
      burst(W + 10, H * 0.85, 90, -Math.PI * 2 / 3, 0.35, 21);
      burst(-10, H * 0.85, 50, -Math.PI / 3, 0.35, 19, 28);
      burst(W + 10, H * 0.85, 50, -Math.PI * 2 / 3, 0.35, 19, 28);
      rain(110, 90);
      sparkles(18, 120);
      if (level === 'jackpot') {
        rain(60, 140, 'coin');
        [[0.25, 0.25, 10], [0.75, 0.2, 40], [0.5, 0.32, 70], [0.3, 0.18, 110], [0.7, 0.3, 140]]
          .forEach(([x, y, d]) => firework(W * x, H * y, d));
        sparkles(25, 200);
      }
    }
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  window.fx = {celebrate};
})();
</script>
