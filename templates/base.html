<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2a">
  <title>{% block title %}下注{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Bungee&display=swap">
  <style>{{ inline_css() }}</style>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if msg %}<div class="toast ok" role="status">{{ msg }}</div>{% endif %}
  {% if err %}<div class="toast err" role="alert">{{ err }}</div>{% endif %}
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
