<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2a">
  {# 加到主畫面：圖示、全螢幕、標題 #}
  <link rel="icon" type="image/png" href="{{ ICONS.favicon }}">
  <link rel="apple-touch-icon" href="{{ ICONS.apple }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{% block app_title %}DS科大賭場{% endblock %}">
  {% block manifest %}{% endblock %}
  <title>{% block title %}下注{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Bungee&display=swap">
  <style>{{ inline_css() }}</style>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if msg %}<div class="toast ok" role="status">{{ msg }}</div>{% endif %}
  {% if err %}<div class="toast err" role="alert">{{ err }}</div>{% endif %}
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
