{# 音效：用 Web Audio 即時合成，不需要音檔。window.sfx.play('名稱')。
   iPhone 規定要使用者點過畫面後才能出聲，所以第一次點擊時解鎖。右下角可以靜音。 #}
<button type="button" class="sfx-toggle" id="sfx-toggle" aria-label="音效開關">🔊</button>
<script>
(() => {
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, muted = store.get('sfx_off') === '1', last = {};
  const btn = document.getElementById('sfx-toggle');
  const paint = () => { btn.textContent = muted ? '🔇' : '🔊'; btn.classList.toggle('off', muted); };
  paint();

  const unlock = () => {
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();
    // iOS：在手勢裡播一段無聲，才算真正解鎖
    const b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
    s.buffer = b; s.connect(ctx.destination); s.start(0);
  };
  ['touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, {capture: true, passive: true}));

  btn.addEventListener('click', () => {
    muted = !muted;
    store.set('sfx_off', muted ? '1' : '0');
    paint();
    if (!muted) play('coin');
  });

  // ---- 合成積木 ----
  const tone = (freq, t0, dur, {type = 'sine', vol = 0.18, to = null} = {}) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  };
  const noise = (t0, dur, {vol = 0.15, freq = 1200, q = 0.8} = {}) => {
    const n = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(ctx.destination);
    s.start(t0);
  };

  const SOUNDS = {
    tap:   t => tone(880, t, 0.05, {type: 'triangle', vol: 0.12}),
    blip:  t => tone(660, t, 0.09, {type: 'square', vol: 0.08}),
    jump:  t => tone(330, t, 0.16, {type: 'square', vol: 0.09, to: 880}),
    fizz:  t => noise(t, 0.09, {vol: 0.12, freq: 3200, q: 1.5}),
    beep:  t => tone(660, t, 0.12, {type: 'square', vol: 0.08}),
    go:    t => tone(1320, t, 0.25, {type: 'square', vol: 0.09}),
    bad:   t => tone(180, t, 0.3, {type: 'sawtooth', vol: 0.1, to: 90}),
    coin:  t => { tone(988, t, 0.08, {type: 'square', vol: 0.08}); tone(1319, t + 0.08, 0.22, {type: 'square', vol: 0.08}); },
    win:   t => [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.1, i === 3 ? 0.45 : 0.14, {type: 'triangle', vol: 0.16})),
    jackpot: t => {
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, t + i * 0.09, 0.16, {type: 'square', vol: 0.07}));
      for (let i = 0; i < 8; i++) tone(2000 + Math.random() * 1500, t + 0.6 + i * 0.06, 0.08, {type: 'sine', vol: 0.06});
    },
    lose:  t => { tone(392, t, 0.18, {type: 'triangle', vol: 0.14}); tone(311, t + 0.18, 0.18, {type: 'triangle', vol: 0.14}); tone(247, t + 0.36, 0.4, {type: 'triangle', vol: 0.14}); },
    tick:  t => tone(1800, t, 0.025, {type: 'square', vol: 0.04}),
    stop:  t => { tone(140, t, 0.12, {type: 'sine', vol: 0.25, to: 70}); noise(t, 0.05, {vol: 0.08, freq: 800}); },
    chip:  t => { tone(2400, t, 0.03, {type: 'triangle', vol: 0.06}); tone(3100, t + 0.03, 0.04, {type: 'triangle', vol: 0.05}); },
    roll:  t => { for (let i = 0; i < 3; i++) noise(t + i * 0.05 + Math.random() * 0.02, 0.04, {vol: 0.12, freq: 600 + Math.random() * 600, q: 2}); },
    flip:  t => noise(t, 0.12, {vol: 0.12, freq: 2500, q: 0.6}),
    pop:   t => { noise(t, 0.08, {vol: 0.25, freq: 500, q: 0.7}); tone(600, t, 0.12, {type: 'sine', vol: 0.15, to: 1400}); },
  };
  const MIN_GAP = {tick: 40, tap: 35, fizz: 60, roll: 60};

  function play(name) {
    if (muted || !AC || !SOUNDS[name]) return;
    if (!ctx) { try { ctx = new AC(); } catch (e) { return; } }
    if (ctx.state !== 'running') return;          // 還沒被點擊解鎖
    const now = performance.now();
    if (MIN_GAP[name] && now - (last[name] || 0) < MIN_GAP[name]) return;
    last[name] = now;
    try { SOUNDS[name](ctx.currentTime + 0.005); } catch (e) {}
  }
  // 擂台的 buzz(…) 震動也順便配上聲音（iPhone 不能震動，至少有聲音）
  function fromBuzz(p) {
    if (Array.isArray(p)) return play('win');
    if (!p) return;
    play(p <= 20 ? 'tap' : (p < 100 ? 'blip' : 'bad'));
  }
  window.sfx = {play, fromBuzz};
})();
</script>
